# =============================================================================
# mpv.conf — Apple Silicon (Mac mini M4) + 4K 120 Hz OLED
# Minimal high-quality configuration
# =============================================================================

vo=gpu-next
gpu-api=vulkan

hwdec=auto-safe

profile=high-quality

video-sync=display-resample

deband=no

alang=en,eng,he,heb
slang=en,eng,he,heb


# -----------------------------------------------------------------------------
# Optional profiles
# -----------------------------------------------------------------------------

[fix-banding]
profile-desc=Conservative debanding
deband=yes
deband-iterations=1
deband-threshold=4
deband-range=16
deband-grain=4

[smooth-timing]
profile-desc=Temporal interpolation for mismatched refresh rates
interpolation=yes

[software-decode]
profile-desc=Disable hardware decoding
hwdec=no


# -----------------------------------------------------------------------------
# Subtitles
# -----------------------------------------------------------------------------

sub-ass-override=no
sub-font-size=48
sub-border-color="#D9000000"
sub-border-size=2.5
sub-shadow-color="#80000000"
sub-shadow-offset=1.5
sub-margin-y=36
sub-font="SF Pro Rounded"